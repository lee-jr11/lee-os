services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leeos}
      POSTGRES_DB: ${POSTGRES_DB:-leeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:configure first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leeos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  leeos_pgdata:
